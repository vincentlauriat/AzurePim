name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Core tests
        run: swift test --package-path Packages/AzurePimCore

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project AzurePim.xcodeproj -scheme AzurePim -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
